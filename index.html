<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUSDEC Assistant - Cloud Sync</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/5253/5253968.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            /* Color Palette */
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --bg-elevated: #2a2a2a;
            --bg-hover: #303030;
            
            --text-primary: #ffffff;
            --text-secondary: #b8b8b8;
            --text-muted: #888888;
            
            --accent-primary: #5865f2;
            --accent-hover: #4752c4;
            --accent-light: rgba(88, 101, 242, 0.1);
            
            --success: #43b581;
            --warning: #faa61a;
            --danger: #f04747;
            --info: #00d4ff;
            
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-default: rgba(255, 255, 255, 0.1);
            --border-strong: rgba(255, 255, 255, 0.2);
            
            /* Spacing System */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            --spacing-3xl: 4rem;
            
            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            --font-mono: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            
            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 20px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.5);
            
            /* Border Radius */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        /* Modern Icons as SVG */
        .icon {
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
            fill: currentColor;
        }

        .icon-lg {
            width: 48px;
            height: 48px;
        }

        .icon-xl {
            width: 64px;
            height: 64px;
        }

        /* Header Styles */
        .header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
            padding: var(--spacing-xl) 0;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            opacity: 0.5;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
        }

        .logo-img {
            height: 72px;
            width: auto;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }

        .logo {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        /* Dashboard Grid */
        .dashboard {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all var(--transition-slow);
        }

        .dashboard.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .main-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-2xl);
        }

        .option-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            cursor: pointer;
            transition: all var(--transition-base);
            border: 1px solid var(--border-subtle);
            position: relative;
            overflow: hidden;
            transform: translateY(0);
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--info));
            opacity: 0;
            transition: opacity var(--transition-base);
        }

        .option-card:hover {
            transform: translateY(-4px);
            background: var(--bg-tertiary);
            border-color: var(--border-default);
            box-shadow: var(--shadow-lg);
        }

        .option-card:hover::before {
            opacity: 1;
        }

        .option-icon {
            margin-bottom: var(--spacing-lg);
            color: var(--accent-primary);
            transition: transform var(--transition-base);
        }

        .option-card:hover .option-icon {
            transform: scale(1.1) rotate(3deg);
        }

        .option-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            letter-spacing: -0.01em;
        }

        .option-desc {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Search Section */
        .search-section {
            display: none;
            background: var(--bg-secondary);
            border-radius: var(--radius-2xl);
            padding: var(--spacing-xl);
            margin: var(--spacing-lg) auto;
            border: 1px solid var(--border-subtle);
            max-width: 900px;
            width: 100%;
            min-height: 70vh;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.95);
            transition: all var(--transition-slow);
            box-shadow: var(--shadow-xl);
        }

        .search-section.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--border-subtle);
        }

        .search-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .close-btn-header {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: none;
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .close-btn-header:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* Search Input */
        .search-controls {
            margin-bottom: var(--spacing-lg);
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: color var(--transition-fast);
        }

        .search-input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-md) var(--spacing-md) calc(var(--spacing-md) + 32px);
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--transition-fast);
            font-family: var(--font-sans);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-input-wrapper:focus-within .search-icon {
            color: var(--accent-primary);
        }

        /* Action Buttons */
        .action-buttons-container {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-family: var(--font-sans);
            height: 40px;
            min-width: 120px;
            justify-content: center;
        }

        .action-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-default);
            transform: translateY(-1px);
        }

        .action-btn.primary {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .action-btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .action-btn.sync {
            background: var(--info);
            border-color: var(--info);
            color: var(--bg-primary);
        }

        .action-btn.sync:hover {
            background: #00b8e6;
            border-color: #00b8e6;
        }

        /* Results */
        .results {
            flex: 1;
            display: grid;
            gap: var(--spacing-md);
            overflow-y: auto;
            padding-right: var(--spacing-sm);
            align-content: start;
        }

        .results::-webkit-scrollbar {
            width: 6px;
        }

        .results::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
        }

        .results::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: var(--radius-full);
        }

        .results::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .result-item {
            background: var(--bg-tertiary);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            transition: all var(--transition-fast);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .result-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--info);
            transition: width var(--transition-fast);
        }

        .result-item:hover {
            background: var(--bg-elevated);
            border-color: var(--border-default);
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }

        .result-item:hover::before {
            width: 5px;
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            cursor: pointer;
            color: var(--text-primary);
            font-family: var(--font-mono);
            padding: 4px 8px;
            margin-left: -8px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .result-title:hover {
            background: var(--accent-light);
            color: var(--accent-primary);
        }

        .copy-hint {
            font-size: 0.75rem;
            color: var(--accent-primary);
            opacity: 0.7;
            transition: opacity var(--transition-fast);
            font-family: var(--font-sans);
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .result-title:hover .copy-hint {
            opacity: 1;
            transform: scale(1.05);
        }

        .result-details {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: var(--spacing-xs);
        }

        .result-category {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        /* Warehouse Chips */
        .warehouse-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .warehouse-container {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .warehouse-chip {
            background: var(--bg-primary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
            min-width: 140px;
            transition: all var(--transition-fast);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .warehouse-chip::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, var(--accent-light));
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .warehouse-chip::after {
            content: '📋';
            position: absolute;
            top: 4px;
            right: 8px;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .warehouse-chip:hover {
            background: var(--bg-tertiary);
            border-color: var(--info);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .warehouse-chip:hover::before {
            opacity: 1;
        }

        .warehouse-chip:hover::after {
            opacity: 0.7;
        }

        .warehouse-code {
            font-size: 1rem;
            font-weight: 600;
            color: var(--info);
            margin-bottom: 2px;
            font-family: var(--font-mono);
            position: relative;
        }

        .warehouse-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.3;
            position: relative;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            opacity: 0;
            transition: opacity var(--transition-slow);
            backdrop-filter: blur(4px);
        }

        .modal.active {
            opacity: 1;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--bg-secondary);
            padding: var(--spacing-xl);
            border-radius: var(--radius-xl);
            width: 90%;
            max-width: 500px;
            transition: transform var(--transition-slow);
            border: 1px solid var(--border-default);
            box-shadow: var(--shadow-xl);
        }

        .modal.active .modal-content {
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-subtle);
        }

        .modal-header h3 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: var(--spacing-xs);
            transition: color var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
        }

        .close-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--transition-fast);
            font-family: var(--font-sans);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .save-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-md);
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            transition: all var(--transition-fast);
            font-family: var(--font-sans);
            height: 48px;
        }

        .save-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl) var(--spacing-xl);
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-lg);
            opacity: 0.3;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }

        .empty-title {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
        }

        .empty-message {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Notification */
        .notification {
            position: fixed;
            top: var(--spacing-md);
            right: var(--spacing-md);
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-lg);
            font-size: 0.875rem;
            font-weight: 500;
            z-index: 10000;
            opacity: 0;
            transform: translateX(300px);
            transition: all var(--transition-slow);
            max-width: 320px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .notification.success {
            border-color: var(--success);
        }

        .notification.success::before {
            content: '✓';
            color: var(--success);
            font-weight: bold;
        }

        .notification.error {
            border-color: var(--danger);
        }

        .notification.error::before {
            content: '✕';
            color: var(--danger);
            font-weight: bold;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--bg-tertiary);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--bg-tertiary);
            border-radius: 50%;
            border-top-color: var(--accent-primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            :root {
                --spacing-xs: 0.25rem;
                --spacing-sm: 0.375rem;
                --spacing-md: 0.75rem;
                --spacing-lg: 1rem;
                --spacing-xl: 1.5rem;
                --spacing-2xl: 2rem;
                --spacing-3xl: 3rem;
            }

            body {
                padding: var(--spacing-sm);
            }

            .header {
                padding: var(--spacing-lg) 0;
                margin-bottom: var(--spacing-xl);
            }

            .logo {
                font-size: 1.5rem;
            }

            .logo-img {
                height: 56px;
            }

            .main-options {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }

            .option-card {
                padding: var(--spacing-lg);
            }

            .search-section {
                padding: var(--spacing-md);
                border-radius: var(--radius-xl);
                min-height: calc(100vh - 2rem);
            }

            .search-header {
                flex-direction: column;
                gap: var(--spacing-md);
                align-items: stretch;
            }

            .close-btn-header {
                position: absolute;
                top: var(--spacing-md);
                right: var(--spacing-md);
            }

            .search-input {
                font-size: 16px; /* Prevent zoom on iOS */
            }

            .action-buttons-container {
                flex-direction: column;
                gap: var(--spacing-sm);
            }

            .action-btn {
                width: 100%;
                height: 44px; /* Touch-friendly height */
            }

            .result-title {
                font-size: 1.125rem;
            }

            .warehouse-container {
                flex-direction: column;
            }

            .warehouse-chip {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: var(--spacing-md);
            }

            .modal-content {
                padding: var(--spacing-lg);
                margin: var(--spacing-md);
                width: calc(100% - 2rem);
            }

            .empty-state {

    <script>
        // Modern CUSDEC Assistant Application with Google Drive Sync
        const app = {
            // Data storage with localStorage persistence
            data: {
                hsn: [],
                client: []
            },

            // Search state
            searchState: {
                hsn: '',
                client: ''
            },

            // Debounce timer
            debounceTimer: null,
            syncDebounceTimer: null,

            // Google Drive integration
            googleDrive: {
                CLIENT_ID: 'YOUR_CLIENT_ID_HERE', // Replace with your Google Client ID
                API_KEY: 'YOUR_API_KEY_HERE', // Replace with your API Key
                DISCOVERY_DOCS: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
                SCOPES: 'https://www.googleapis.com/auth/drive.file',
                isSignedIn: false,
                syncInProgress: false
            },

            // Initialize application
            init() {
                this.loadData();
                this.attachEventListeners();
                this.showDashboard();
                this.initGoogleDrive();
            },

            // Initialize Google Drive API
            initGoogleDrive() {
                const script = document.createElement('script');
                script.src = 'https://apis.google.com/js/api.js';
                script.onload = () => {
                    gapi.load('client:auth2', () => {
                        gapi.client.init({
                            apiKey: this.googleDrive.API_KEY,
                            clientId: this.googleDrive.CLIENT_ID,
                            discoveryDocs: this.googleDrive.DISCOVERY_DOCS,
                            scope: this.googleDrive.SCOPES
                        }).then(() => {
                            // Listen for sign-in state changes
                            gapi.auth2.getAuthInstance().isSignedIn.listen((isSignedIn) => {
                                this.googleDrive.isSignedIn = isSignedIn;
                                if (isSignedIn) {
                                    this.showNotification('Connected to Google Drive', 'success');
                                    // Initial sync when connected
                                    this.syncFromCloud('hsn');
                                    this.syncFromCloud('client');
                                }
                            });

                            // Handle initial sign-in state
                            this.googleDrive.isSignedIn = gapi.auth2.getAuthInstance().isSignedIn.get();
                        }).catch(error => {
                            console.error('Error initializing Google Drive:', error);
                        });
                    });
                };
                document.head.appendChild(script);
            },

            // Sign in to Google Drive
            async signInToGoogleDrive() {
                try {
                    await gapi.auth2.getAuthInstance().signIn();
                } catch (error) {
                    console.error('Sign in failed:', error);
                    this.showNotification('Failed to sign in to Google Drive', 'error');
                }
            },

            // Sync from Google Drive (merge only, never delete)
            async syncFromCloud(type) {
                if (!this.googleDrive.isSignedIn) {
                    await this.signInToGoogleDrive();
                    if (!this.googleDrive.isSignedIn) return;
                }

                if (this.googleDrive.syncInProgress) {
                    this.showNotification('Sync already in progress...', 'info');
                    return;
                }

                this.googleDrive.syncInProgress = true;
                this.showNotification(`Syncing ${type} data from cloud...`, 'info');

                try {
                    const fileName = `cusdec_${type}_data.json`;
                    
                    // Search for the file
                    const response = await gapi.client.drive.files.list({
                        q: `name='${fileName}' and trashed=false`,
                        spaces: 'drive',
                        fields: 'files(id, name)'
                    });

                    if (response.result.files && response.result.files.length > 0) {
                        // File exists, download it
                        const fileId = response.result.files[0].id;
                        const fileContent = await gapi.client.drive.files.get({
                            fileId: fileId,
                            alt: 'media'
                        });

                        const cloudData = JSON.parse(fileContent.body);
                        
                        // Merge with local data (never delete, only add missing)
                        const mergedData = this.mergeData(type, this.data[type], cloudData);
                        const addedCount = mergedData.length - this.data[type].length;
                        
                        this.data[type] = mergedData;
                        this.saveData(false); // Save locally without triggering cloud sync
                        
                        // Refresh display if searching
                        const searchInput = document.getElementById(type + 'Search');
                        if (searchInput && searchInput.value.trim()) {
                            this.performSearch(type, searchInput.value);
                        }
                        
                        if (addedCount > 0) {
                            this.showNotification(`Added ${addedCount} new ${type} records from cloud`, 'success');
                        } else {
                            this.showNotification(`${type} data is up to date`, 'success');
                        }
                    } else {
                        // No file in cloud, create one with current data
                        await this.saveToGoogleDrive(type);
                        this.showNotification(`Created ${type} data in cloud`, 'success');
                    }
                } catch (error) {
                    console.error('Sync error:', error);
                    this.showNotification(`Failed to sync ${type} data`, 'error');
                } finally {
                    this.googleDrive.syncInProgress = false;
                }
            },

            // Merge data (never delete, only add missing)
            mergeData(type, localData, cloudData) {
                if (type === 'hsn') {
                    // For HSN, use code as unique identifier
                    const localCodes = new Set(localData.map(item => item.code));
                    const newItems = cloudData.filter(item => !localCodes.has(item.code));
                    return [...localData, ...newItems];
                } else {
                    // For clients, use tin+warehouse as unique identifier
                    const localKeys = new Set(localData.map(item => `${item.tin}-${item.warehouse}`));
                    const newItems = cloudData.filter(item => !localKeys.has(`${item.tin}-${item.warehouse}`));
                    return [...localData, ...newItems];
                }
            },

            // Save to Google Drive
            async saveToGoogleDrive(type) {
                if (!this.googleDrive.isSignedIn) return;

                try {
                    const fileName = `cusdec_${type}_data.json`;
                    const fileContent = JSON.stringify(this.data[type], null, 2);
                    
                    // Search for existing file
                    const searchResponse = await gapi.client.drive.files.list({
                        q: `name='${fileName}' and trashed=false`,
                        spaces: 'drive',
                        fields: 'files(id)'
                    });

                    const boundary = '-------314159265358979323846';
                    const delimiter = "\r\n--" + boundary + "\r\n";
                    const close_delim = "\r\n--" + boundary + "--";

                    const metadata = {
                        'name': fileName,
                        'mimeType': 'application/json'
                    };

                    const multipartRequestBody =
                        delimiter +
                        'Content-Type: application/json\r\n\r\n' +
                        JSON.stringify(metadata) +
                        delimiter +
                        'Content-Type: application/json\r\n\r\n' +
                        fileContent +
                        close_delim;

                    if (searchResponse.result.files && searchResponse.result.files.length > 0) {
                        // Update existing file
                        const fileId = searchResponse.result.files[0].id;
                        await gapi.client.request({
                            'path': `/upload/drive/v3/files/${fileId}`,
                            'method': 'PATCH',
                            'params': {'uploadType': 'multipart'},
                            'headers': {
                                'Content-Type': 'multipart/related; boundary="' + boundary + '"'
                            },
                            'body': multipartRequestBody
                        });
                    } else {
                        // Create new file
                        await gapi.client.request({
                            'path': '/upload/drive/v3/files',
                            'method': 'POST',
                            'params': {'uploadType': 'multipart'},
                            'headers': {
                                'Content-Type': 'multipart/related; boundary="' + boundary + '"'
                            },
                            'body': multipartRequestBody
                        });
                    }
                } catch (error) {
                    console.error('Save to Google Drive error:', error);
                    // Don't show error notification for auto-sync failures
                }
            },

            // Load data from localStorage or defaults
            loadData() {
                const savedHSN = localStorage.getItem('cusdec_hsn_data');
                const savedClient = localStorage.getItem('cusdec_client_data');

                if (savedHSN) {
                    this.data.hsn = JSON.parse(savedHSN);

                    this.loadDefaultData();
                }

                    this.data.client = JSON.parse(savedClient);
                } else {
                    this.loadDefaultClientData();
                }
            },

            // Attach event listeners
            attachEventListeners() {
                // Search inputs with debouncing
                document.getElementById('hsnSearch').addEventListener('input', (e) => {
                    this.debounceSearch('hsn', e.target.value);
                });

                document.getElementById('clientSearch').addEventListener('input', (e) => {
                    this.debounceSearch('client', e.target.value);
                });

                // Modal backdrop click
                document.getElementById('addModal').addEventListener('click', (e) => {
                    if (e.target.id === 'addModal') {
                        this.closeModal();
                    }
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        const modal = document.getElementById('addModal');
                        if (modal.classList.contains('active')) {
                            this.closeModal();
                        } else {
                            this.showDashboard();
                        }
                    }
                });
            },

            // Debounced search
            debounceSearch(type, query) {
                clearTimeout(this.debounceTimer);
                this.searchState[type] = query;

                this.debounceTimer = setTimeout(() => {
                    this.performSearch(type, query);
                }, 300);
            },

            // Perform search with smart matching
            performSearch(type, query) {
                const trimmedQuery = query.toLowerCase().trim();
                
                if (!trimmedQuery) {
                    this.showEmptyState(type);
                    return;
                }

                let filtered = [];
                const searchTerms = trimmedQuery.split(/\s+/); // Split by spaces for multi-word search

                if (type === 'hsn') {
                    filtered = this.data.hsn.filter(item => {
                        const searchableText = [
                            item.code || '',
                            item.product || '',
                            item.category || ''
                        ].join(' ').toLowerCase();
                        
                        // Smart matching: All search terms must be found
                        return searchTerms.every(term => searchableText.includes(term));
                    });

                    // Sort results by relevance
                    filtered.sort((a, b) => {
                        // Exact code match gets highest priority
                        if (a.code && a.code.toLowerCase() === trimmedQuery) return -1;
                        if (b.code && b.code.toLowerCase() === trimmedQuery) return 1;
                        
                        // Code starts with query
                        if (a.code && a.code.toLowerCase().startsWith(trimmedQuery)) return -1;
                        if (b.code && b.code.toLowerCase().startsWith(trimmedQuery)) return 1;
                        
                        // Product exact match
                        if (a.product && a.product.toLowerCase().includes(trimmedQuery)) return -1;
                        if (b.product && b.product.toLowerCase().includes(trimmedQuery)) return 1;
                        
                        return 0;
                    });
                } else {
                    filtered = this.data.client.filter(item => {
                        const searchableText = [
                            item.tin || '',
                            item.name || '',
                            item.warehouse || '',
                            item.warehouseName || ''
                        ].join(' ').toLowerCase();
                        
                        // Smart matching: All search terms must be found
                        return searchTerms.every(term => searchableText.includes(term));
                    });

                    // Sort results by relevance
                    filtered.sort((a, b) => {
                        // Exact TIN match gets highest priority
                        if (a.tin && a.tin.toLowerCase() === trimmedQuery) return -1;
                        if (b.tin && b.tin.toLowerCase() === trimmedQuery) return 1;
                        
                        // Exact warehouse code match
                        if (a.warehouse && a.warehouse.toLowerCase() === trimmedQuery) return -1;
                        if (b.warehouse && b.warehouse.toLowerCase() === trimmedQuery) return 1;
                        
                        // Company name starts with query
                        if (a.name && a.name.toLowerCase().startsWith(trimmedQuery)) return -1;
                        if (b.name && b.name.toLowerCase().startsWith(trimmedQuery)) return 1;
                        
                        return 0;
                    });
                }

                if (filtered.length === 0) {
                    this.showEmptyState(type, `No results found for "${query}"`);
                } else {
                    this.displayResults(type, filtered);
                }
            },

            // Display search results
            displayResults(type, data) {
                const container = document.getElementById(type === 'hsn' ? 'hsnResults' : 'clientResults');
                container.innerHTML = '';

                if (type === 'hsn') {
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `
                            <div class="result-title" onclick="app.copyToClipboard('${item.code}', 'HSN Code')" title="Click to copy HSN code">
                                ${this.escapeHtml(item.code || 'N/A')}
                                <span class="copy-hint">📋 Click to copy</span>
                            </div>
                            <div class="result-details"><strong>Product:</strong> ${this.escapeHtml(item.product || 'N/A')}</div>
                            <div class="result-category">Category: ${this.escapeHtml(item.category || 'N/A')}</div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    // Group clients by company
                    const grouped = this.groupClientData(data);
                    
                    Object.values(grouped).forEach(company => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        
                        const warehouseChips = company.warehouses.map(wh => 
                            `<div class="warehouse-chip" onclick="app.copyToClipboard('${wh.code}', 'Warehouse Code')" title="Click to copy warehouse code">
                                <div class="warehouse-code">${this.escapeHtml(wh.code || 'N/A')}</div>
                                <div class="warehouse-name">${this.escapeHtml(wh.name || 'N/A')}</div>
                            </div>`
                        ).join('');
                        
                        div.innerHTML = `
                            <div class="result-title" onclick="app.copyToClipboard('${company.tin}', 'TIN')" title="Click to copy TIN">
                                TIN: ${this.escapeHtml(company.tin || 'N/A')}
                                <span class="copy-hint">📋 Click to copy</span>
                            </div>
                            <div class="result-details"><strong>Company:</strong> ${this.escapeHtml(company.name || 'N/A')}</div>
                            <div class="warehouse-container">
                                <div class="warehouse-label">Warehouses (click to copy):</div>
                                ${warehouseChips}
                            </div>
                        `;
                        container.appendChild(div);
                    });
                }
            },

            // Group client data by company
            groupClientData(data) {
                return data.reduce((acc, item) => {
                    const key = `${item.name}-${item.tin}`;
                    if (!acc[key]) {
                        acc[key] = {
                            name: item.name,
                            tin: item.tin,
                            warehouses: []
                        };
                    }
                    acc[key].warehouses.push({
                        name: item.warehouseName,
                        code: item.warehouse
                    });
                    return acc;
                }, {});
            },

            // Show empty state
            showEmptyState(type, message = null) {
                const container = document.getElementById(type === 'hsn' ? 'hsnResults' : 'clientResults');
                const defaultMessage = type === 'hsn' 
                    ? 'Start typing to search HSN codes...' 
                    : 'Start typing to search client information...';
                
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">${message ? 'No Results' : 'Ready to Search'}</div>
                        <div class="empty-message">${message || defaultMessage}</div>
                    </div>
                `;
            },

            // Navigation methods
            showSection(section) {
                // Hide dashboard
                const dashboard = document.getElementById('dashboard');
                dashboard.classList.remove('active');
                
                setTimeout(() => {
                    dashboard.style.display = 'none';
                    
                    // Show section
                    const sectionEl = document.getElementById(section + 'Section');
                    sectionEl.style.display = 'flex';
                    
                    setTimeout(() => {
                        sectionEl.classList.add('active');
                        
                        // Focus search input
                        const searchInput = document.getElementById(section + 'Search');
                        searchInput.focus();
                        
                        // Show appropriate empty state
                        this.showEmptyState(section);
                    }, 50);
                }, 300);
            },

            showDashboard() {
                // Hide all sections
                ['hsnSection', 'clientSection'].forEach(id => {
                    const section = document.getElementById(id);
                    section.classList.remove('active');
                    setTimeout(() => {
                        section.style.display = 'none';
                    }, 300);
                });
                
                // Show dashboard
                setTimeout(() => {
                    const dashboard = document.getElementById('dashboard');
                    dashboard.style.display = 'block';
                    setTimeout(() => {
                        dashboard.classList.add('active');
                    }, 50);
                }, 300);
            },

            // Modal methods
            showAddModal(type) {
                const modal = document.getElementById('addModal');
                const title = document.getElementById('modalTitle');
                const form = document.getElementById('modalForm');
                
                if (type === 'hsn') {
                    title.textContent = 'Add New HSN Code';
                    
                    const categories = [...new Set(this.data.hsn.map(item => item.category).filter(Boolean))];
                    const categoryOptions = categories.map(cat => `<option value="${cat}">`).join('');
                    
                    form.innerHTML = `
                        <form onsubmit="app.saveHSN(event)">
                            <div class="form-group">
                                <label class="form-label">Category</label>
                                <input type="text" class="form-input" id="newCategory" list="categoryList" required>
                                <datalist id="categoryList">${categoryOptions}</datalist>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Product Name</label>
                                <input type="text" class="form-input" id="newProduct" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">HSN Code</label>
                                <input type="text" class="form-input" id="newHSNCode" required pattern="[0-9]{8}" 
                                       placeholder="8-digit HSN code" maxlength="8">
                            </div>
                            <button type="submit" class="save-btn">Save HSN Code</button>
                        </form>
                    `;
                } else {
                    title.textContent = 'Add New Client';
                    
                    const companies = [...new Set(this.data.client.map(item => item.name).filter(Boolean))];
                    const warehouses = [...new Set(this.data.client.map(item => item.warehouseName).filter(Boolean))];
                    
                    const companyOptions = companies.map(comp => `<option value="${comp}">`).join('');
                    const warehouseOptions = warehouses.map(wh => `<option value="${wh}">`).join('');
                    
                    form.innerHTML = `
                        <form onsubmit="app.saveClient(event)">
                            <div class="form-group">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-input" id="newClientName" list="companyList" required>
                                <datalist id="companyList">${companyOptions}</datalist>
                            </div>
                            <div class="form-group">
                                <label class="form-label">TIN Code</label>
                                <input type="text" class="form-input" id="newTIN" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Warehouse Name</label>
                                <input type="text" class="form-input" id="newWarehouseName" list="warehouseList" required>
                                <datalist id="warehouseList">${warehouseOptions}</datalist>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Warehouse Number</label>
                                <input type="text" class="form-input" id="newWarehouse" required>
                            </div>
                            <button type="submit" class="save-btn">Save Client</button>
                        </form>
                    `;
                }
                
                modal.style.display = 'block';
                setTimeout(() => {
                    modal.classList.add('active');
                    // Focus first input
                    const firstInput = form.querySelector('input');
                    if (firstInput) firstInput.focus();
                }, 10);
            },

            closeModal() {
                const modal = document.getElementById('addModal');
                modal.classList.remove('active');
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 300);
            },

            // Save methods
            saveHSN(event) {
                event.preventDefault();
                
                const newItem = {
                    category: document.getElementById('newCategory').value.trim(),
                    product: document.getElementById('newProduct').value.trim(),
                    code: document.getElementById('newHSNCode').value.trim()
                };
                
                // Check for duplicates
                const isDuplicate = this.data.hsn.some(item => item.code === newItem.code);
                if (isDuplicate) {
                    this.showNotification('HSN code already exists', 'error');
                    return;
                }
                
                this.data.hsn.push(newItem);
                this.saveData();
                this.closeModal();
                this.showNotification('HSN code added successfully', 'success');
                
                // Refresh search if active
                const searchQuery = document.getElementById('hsnSearch').value.trim();
                if (searchQuery) {
                    this.performSearch('hsn', searchQuery);
                }
            },

            saveClient(event) {
                event.preventDefault();
                
                const newItem = {
                    name: document.getElementById('newClientName').value.trim(),
                    tin: document.getElementById('newTIN').value.trim(),
                    warehouseName: document.getElementById('newWarehouseName').value.trim(),
                    warehouse: document.getElementById('newWarehouse').value.trim()
                };
                
                // Check for duplicate warehouse
                const isDuplicate = this.data.client.some(item => 
                    item.tin === newItem.tin && item.warehouse === newItem.warehouse
                );
                if (isDuplicate) {
                    this.showNotification('This warehouse already exists for this TIN', 'error');
                    return;
                }
                
                this.data.client.push(newItem);
                this.saveData();
                this.closeModal();
                this.showNotification('Client added successfully', 'success');
                
                // Refresh search if active
                const searchQuery = document.getElementById('clientSearch').value.trim();
                if (searchQuery) {
                    this.performSearch('client', searchQuery);
                }
            },

            // Export data
            exportData(type) {
                const data = type === 'hsn' ? this.data.hsn : this.data.client;
                
                if (data.length === 0) {
                    this.showNotification('No data to export', 'error');
                    return;
                }

                // Create workbook
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, type.toUpperCase());
                
                // Generate filename with timestamp
                const date = new Date().toISOString().split('T')[0];
                const filename = `cusdec_${type}_${date}.xlsx`;
                
                // Write file
                XLSX.writeFile(wb, filename);
                this.showNotification('Data exported successfully', 'success');
            },

            // Copy to clipboard
            async copyToClipboard(text, type) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        // Fallback method
                        const textArea = document.createElement('textarea');
                        textArea.value = text;
                        textArea.style.position = 'fixed';
                        textArea.style.opacity = '0';
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }
                    this.showNotification(`${type} copied: ${text}`, 'success');
                } catch (err) {
                    console.error('Copy failed:', err);
                    this.showNotification('Failed to copy', 'error');
                }
            },

            // Show notification
            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                // Trigger animation
                setTimeout(() => {
                    notification.classList.add('show');
                }, 10);
                
                // Remove notification
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            },

            // Utility: Escape HTML
            escapeHtml(unsafe) {
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
        };

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
