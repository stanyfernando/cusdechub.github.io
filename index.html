                                       placeholder="8-digit HSN code" maxlength="8">
                            </div>
                            <button type="submit" class="save-btn">Save HSN Code</button>
                        </form>
                    `;
                } else {
                    title.textContent = 'Add New Client';
                    
                    const companies = [...new Set(this.data.client.map(item => item.name).filter(Boolean))];
                    const warehouses = [...new Set(this.data.client.map(item => item.warehouseName).filter(Boolean))];
                    
                    const companyOptions = companies.map(comp => `<option value="${comp}">`).join('');
                    const warehouseOptions = warehouses.map(wh => `<option value="${wh}">`).join('');
                    
                    form.innerHTML = `
                        <form onsubmit="app.saveClient(event)">
                            <div class="form-group">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-input" id="newClientName" list="companyList" required>
                                <datalist id="companyList">${companyOptions}</datalist>
                            </div>
                            <div class="form-group">
                                <label class="form-label">TIN Code</label>
                                <input type="text" class="form-input" id="newTIN" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Warehouse Name</label>
                                <input type="text" class="form-input" id="newWarehouseName" list="warehouseList" required>
                                <datalist id="warehouseList">${warehouseOptions}</datalist>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Warehouse Number</label>
                                <input type="text" class="form-input" id="newWarehouse" required>
                            </div>
                            <button type="submit" class="save-btn">Save Client</button>
                        </form>
                    `;
                }
                
                modal.style.display = 'block';
                setTimeout(() => {
                    modal.classList.add('active');
                    // Focus first input
                    const firstInput = form.querySelector('input');
                    if (firstInput) firstInput.focus();
                }, 10);
            },

            closeModal() {
                const modal = document.getElementById('addModal');
                modal.classList.remove('active');
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 300);
            },

            // Save methods
            saveHSN(event) {
                event.preventDefault();
                
                const newItem = {
                    category: document.getElementById('newCategory').value.trim(),
                    product: document.getElementById('newProduct').value.trim(),
                    code: document.getElementById('newHSNCode').value.trim()
                };
                
                // Check for duplicates
                const isDuplicate = this.data.hsn.some(item => item.code === newItem.code);
                if (isDuplicate) {
                    this.showNotification('HSN code already exists', 'error');
                    return;
                }
                
                this.data.hsn.push(newItem);
                this.saveData();
                this.closeModal();
                this.showNotification('HSN code added successfully', 'success');
                
                // Refresh search if active
                const searchQuery = document.getElementById('hsnSearch').value.trim();
                if (searchQuery) {
                    this.performSearch('hsn', searchQuery);
                }
            },

            saveClient(event) {
                event.preventDefault();
                
                const newItem = {
                    name: document.getElementById('newClientName').value.trim(),
                    tin: document.getElementById('newTIN').value.trim(),
                    warehouseName: document.getElementById('newWarehouseName').value.trim(),
                    warehouse: document.getElementById('newWarehouse').value.trim()
                };
                
                // Check for duplicate warehouse
                const isDuplicate = this.data.client.some(item => 
                    item.tin === newItem.tin && item.warehouse === newItem.warehouse
                );
                if (isDuplicate) {
                    this.showNotification('This warehouse already exists for this TIN', 'error');
                    return;
                }
                
                this.data.client.push(newItem);
                this.saveData();
                this.closeModal();
                this.showNotification('Client added successfully', 'success');
                
                // Refresh search if active
                const searchQuery = document.getElementById('clientSearch').value.trim();
                if (searchQuery) {
                    this.performSearch('client', searchQuery);
                }
            },

            // Edit item
            editItem(type, index, identifier) {
                const modal = document.getElementById('addModal');
                const title = document.getElementById('modalTitle');
                const form = document.getElementById('modalForm');
                
                if (type === 'hsn') {
                    const item = this.data.hsn[index];
                    title.textContent = 'Edit HSN Code';
                    
                    const categories = [...new Set(this.data.hsn.map(item => item.category).filter(Boolean))];
                    const categoryOptions = categories.map(cat => `<option value="${cat}">`).join('');
                    
                    form.innerHTML = `
                        <form onsubmit="app.updateHSN(event, ${index})">
                            <div class="form-group">
                                <label class="form-label">Category</label>
                                <input type="text" class="form-input" id="editCategory" list="categoryList" value="${this.escapeHtml(item.category)}" required>
                                <datalist id="categoryList">${categoryOptions}</datalist>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Product Name</label>
                                <input type="text" class="form-input" id="editProduct" value="${this.escapeHtml(item.product)}" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">HSN Code</label>
                                <input type="text" class="form-input" id="editHSNCode" value="${this.escapeHtml(item.code)}" required pattern="[0-9]{8}" 
                                       placeholder="8-digit HSN code" maxlength="8">
                            </div>
                            <button type="submit" class="save-btn">Update HSN Code</button>
                            <button type="button" class="delete-btn" onclick="app.deleteFromModal('hsn', '${item.code}', ${index})" style="margin-top: var(--spacing-md);">
                                <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                                    <path d="M10 11v6"></path>
                                    <path d="M14 11v6"></path>
                                </svg>
                                Delete HSN Code
                            </button>
                        </form>
                    `;
                } else {
                    const item = this.data.client[index];
                    title.textContent = 'Edit Client';
                    
                    const companies = [...new Set(this.data.client.map(item => item.name).filter(Boolean))];
                    const warehouses = [...new Set(this.data.client.map(item => item.warehouseName).filter(Boolean))];
                    
                    const companyOptions = companies.map(comp => `<option value="${comp}">`).join('');
                    const warehouseOptions = warehouses.map(wh => `<option value="${wh}">`).join('');
                    
                    form.innerHTML = `
                        <form onsubmit="app.updateClient(event, ${index})">
                            <div class="form-group">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-input" id="editClientName" list="companyList" value="${this.escapeHtml(item.name)}" required>
                                <datalist id="companyList">${companyOptions}</datalist>
                            </div>
                            <div class="form-group">
                                <label class="form-label">TIN Code</label>
                                <input type="text" class="form-input" id="editTIN" value="${this.escapeHtml(item.tin)}" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Warehouse Name</label>
                                <input type="text" class="form-input" id="editWarehouseName" list="warehouseList" value="${this.escapeHtml(item.warehouseName)}" required>
                                <datalist id="warehouseList">${warehouseOptions}</datalist>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Warehouse Number</label>
                                <input type="text" class="form-input" id="editWarehouse" value="${this.escapeHtml(item.warehouse)}" required>
                            </div>
                            <button type="submit" class="save-btn">Update Client</button>
                            <button type="button" class="delete-btn" onclick="app.deleteFromModal('client', '${item.tin}-${item.warehouse}', ${index})" style="margin-top: var(--spacing-md);">
                                <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                                    <path d="M10 11v6"></path>
                                    <path d="M14 11v6"></path>
                                </svg>
                                Delete Warehouse
                            </button>
                        </form>
                    `;
                }
                
                modal.style.display = 'block';
                setTimeout(() => {
                    modal.classList.add('active');
                    // Focus first input
                    const firstInput = form.querySelector('input');
                    if (firstInput) firstInput.focus();
                }, 10);
            },

            // Edit client (show all warehouses)
            editClient(tin) {
                const modal = document.getElementById('addModal');
                const title = document.getElementById('modalTitle');
                const form = document.getElementById('modalForm');
                
                // Get all warehouses for this TIN
                const clientWarehouses = this.data.client.filter(c => c.tin === tin);
                if (clientWarehouses.length === 0) return;
                
                const companyName = clientWarehouses[0].name;
                title.textContent = `Edit Client: ${companyName}`;
                
                const warehousesList = clientWarehouses.map((item, idx) => {
                    const actualIndex = this.data.client.findIndex(c => c.tin === item.tin && c.warehouse === item.warehouse);
                    return `
                        <div class="warehouse-edit-item">
                            <div class="warehouse-edit-details">
                                <strong>${this.escapeHtml(item.warehouse)}</strong> - ${this.escapeHtml(item.warehouseName)}
                            </div>
                            <div class="warehouse-edit-actions">
                                <button type="button" class="small-btn edit" onclick="app.editItem('client', ${actualIndex}, '${item.tin}-${item.warehouse}')">
                                    <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                    </svg>
                                </button>
                                <button type="button" class="small-btn delete" onclick="app.deleteFromModal('client', '${item.tin}-${item.warehouse}', ${actualIndex})">
                                    <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
                
                form.innerHTML = `
                    <form onsubmit="app.updateClientInfo(event, '${tin}')">
                        <div class="form-group">
                            <label class="form-label">Company Name</label>
                            <input type="text" class="form-input" id="editCompanyName" value="${this.escapeHtml(companyName)}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">TIN Code</label>
                            <input type="text" class="form-input" id="editCompanyTIN" value="${this.escapeHtml(tin)}" required>
                        </div>
                        <button type="submit" class="save-btn">Update Company Info</button>
                    </form>
                    <div class="warehouses-list" style="margin-top: var(--spacing-lg);">
                        <h4 style="margin-bottom: var(--spacing-md); color: var(--text-secondary);">Warehouses</h4>
                        ${warehousesList}
                    </div>
                    <button type="button" class="delete-btn" onclick="app.deleteEntireClient('${tin}')" style="margin-top: var(--spacing-lg);">
                        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                        </svg>
                        Delete Entire Client
                    </button>
                `;
                
                modal.style.display = 'block';
                setTimeout(() => {
                    modal.classList.add('active');
                }, 10);
            },

            // Update client info (name and TIN)
            updateClientInfo(event, oldTin) {
                event.preventDefault();
                
                const newName = document.getElementById('editCompanyName').value.trim();
                const newTin = document.getElementById('editCompanyTIN').value.trim();
                
                // Check if TIN changed and if new TIN already exists
                if (oldTin !== newTin) {
                    const exists = this.data.client.some(c => c.tin === newTin);
                    if (exists) {
                        this.showNotification('A client with this TIN already exists', 'error');
                        return;
                    }
                }
                
                // Update all warehouses for this client
                this.data.client = this.data.client.map(client => {
                    if (client.tin === oldTin) {
                        return { ...client, name: newName, tin: newTin };
                    }
                    return client;
                });
                
                this.saveData();
                this.closeModal();
                this.showNotification('Client information updated successfully', 'success');
                
                // Refresh search if active
                const searchQuery = document.getElementById('clientSearch').value.trim();
                if (searchQuery) {
                    this.performSearch('client', searchQuery);
                }
            },

            // Delete entire client
            deleteEntireClient(tin) {
                const clientWarehouses = this.data.client.filter(c => c.tin === tin);
                const companyName = clientWarehouses[0]?.name || 'this client';
                
                if (confirm(`Are you sure you want to delete ${companyName} and all ${clientWarehouses.length} warehouses?`)) {
                    this.data.client = this.data.client.filter(c => c.tin !== tin);
                    this.saveData();
                    this.closeModal();
                    this.showNotification('Client deleted successfully', 'success');
                    
                    // Refresh search if active
                    const searchQuery = document.getElementById('clientSearch').value.trim();
                    if (searchQuery) {
                        this.performSearch('client', searchQuery);
                    }
                }
            },

            // Delete from modal with confirmation
            deleteFromModal(type, identifier, index) {
                const confirmMessage = type === 'hsn' 
                    ? 'Are you sure you want to delete this HSN code?' 
                    : 'Are you sure you want to delete this warehouse?';
                
                if (confirm(confirmMessage)) {
                    this.deleteItem(type, identifier);
                    this.closeModal();
                }
            },

            // Update HSN
            updateHSN(event, index) {
                event.preventDefault();
                
                const updatedItem = {
                    category: document.getElementById('editCategory').value.trim(),
                    product: document.getElementById('editProduct').value.trim(),
                    code: document.getElementById('editHSNCode').value.trim()
                };
                
                // Check for duplicate code (excluding current item)
                const isDuplicate = this.data.hsn.some((item, i) => 
                    i !== index && item.code === updatedItem.code
                );
                if (isDuplicate) {
                    this.showNotification('HSN code already exists', 'error');
                    return;
                }
                
                this.data.hsn[index] = updatedItem;
                this.saveData();
                this.closeModal();
                this.showNotification('HSN code updated successfully', 'success');
                
                // Refresh search if active
                const searchQuery = document.getElementById('hsnSearch').value.trim();
                if (searchQuery) {
                    this.performSearch('hsn', searchQuery);
                }
            },

            // Update Client
            updateClient(event, index) {
                event.preventDefault();
                
                const updatedItem = {
                    name: document.getElementById('editClientName').value.trim(),
                    tin: document.getElementById('editTIN').value.trim(),
                    warehouseName: document.getElementById('editWarehouseName').value.trim(),
                    warehouse: document.getElementById('editWarehouse').value.trim()
                };
                
                // Check for duplicate warehouse (excluding current item)
                const isDuplicate = this.data.client.some((item, i) => 
                    i !== index && item.tin === updatedItem.tin && item.warehouse === updatedItem.warehouse
                );
                if (isDuplicate) {
                    this.showNotification('This warehouse already exists for this TIN', 'error');
                    return;
                }
                
                this.data.client[index] = updatedItem;
                this.saveData();
                this.closeModal();
                this.showNotification('Client updated successfully', 'success');
                
                // Refresh search if active
                const searchQuery = document.getElementById('clientSearch').value.trim();
                if (searchQuery) {
                    this.performSearch('client', searchQuery);
                }
            },

            // Delete item
            deleteItem(type, identifier) {
                const confirmDelete = confirm(`Are you sure you want to delete this ${type === 'hsn' ? 'HSN code' : 'warehouse'}?`);
                if (!confirmDelete) return;

                if (type === 'hsn') {
                    // Delete by HSN code
                    this.data.hsn = this.data.hsn.filter(item => item.code !== identifier);
                    this.showNotification('HSN code deleted successfully', 'success');
                } else {
                    // Delete by TIN-Warehouse combination
                    const [tin, warehouse] = identifier.split('-');
                    this.data.client = this.data.client.filter(item => 
                        !(item.tin === tin && item.warehouse === warehouse)
                    );
                    this.showNotification('Warehouse deleted successfully', 'success');
                }
                
                this.saveData();
                
                // Refresh search if active
                const searchInput = document.getElementById(type + 'Search');
                if (searchInput && searchInput.value.trim()) {
                    this.performSearch(type, searchInput.value);
                }
            },

            // Export data
            exportData(type) {
                const data = type === 'hsn' ? this.data.hsn : this.data.client;
                
                if (data.length === 0) {
                    this.showNotification('No data to export', 'error');
                    return;
                }

                // Create CSV content
                let csvContent = '';
                
                if (type === 'hsn') {
                    csvContent = 'Category,Product,HSN Code\n';
                    data.forEach(item => {
                        csvContent += `"${item.category}","${item.product}","${item.code}"\n`;
                    });
                } else {
                    csvContent = 'Company Name,TIN,Warehouse Name,Warehouse Code\n';
                    data.forEach(item => {
                        csvContent += `"${item.name}","${item.tin}","${item.warehouseName}","${item.warehouse}"\n`;
                    });
                }
                
                // Create blob and download
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                
                const date = new Date().toISOString().split('T')[0];
                const filename = `cusdec_${type}_${date}.csv`;
                
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                this.showNotification('Data exported successfully', 'success');
            },

            // Copy to clipboard
            async copyToClipboard(text, type) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        // Fallback method
                        const textArea = document.createElement('textarea');
                        textArea.value = text;
                        textArea.style.position = 'fixed';
                        textArea.style.opacity = '0';
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }
                    this.showNotification(`${type} copied: ${text}`, 'success');
                } catch (err) {
                    console.error('Copy failed:', err);
                    this.showNotification('Failed to copy', 'error');
                }
            },

            // Show notification
            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                // Trigger animation
                setTimeout(() => {
                    notification.classList.add('show');
                }, 10);
                
                // Remove notification
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            },

            // Utility: Escape HTML
            escapeHtml(unsafe) {
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
        };

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
